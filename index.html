<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0E6F78; --ink:#10242E; --muted:#4A6572; --bg:#EEF3F6; --card:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:24px 16px 130px;max-width:1240px;margin:0 auto}
button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
header small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:18px;font-weight:800}
.round{width:44px;height:44px;border-radius:22px;border:0;background:#fff;box-shadow:0 2px 8px rgba(16,36,46,.08);display:flex;align-items:center;justify-content:center}
.hero{background:var(--accent);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:stretch;margin-bottom:12px;gap:12px}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;display:block}
.hero .s{font-size:13px;font-weight:600;opacity:.92}
.hero .pill{display:block;line-height:1.25;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;text-align:left}
.hero .pill + .pill{margin-top:6px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 16px;height:48px;box-shadow:0 2px 8px rgba(16,36,46,.06);margin-bottom:12px}
.search input{flex:1;border:0;outline:0;font:500 15px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:transparent;min-width:0}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{height:44px;padding:0 16px;border-radius:22px;border:0;background:#fff;color:var(--ink);font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}

/* Carrelage de toutes les salles */
#liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (min-width:700px){#liste{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
@media (min-width:1000px){#liste{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
#liste .empty{grid-column:1/-1}
.tile{position:relative;min-height:104px;border:0;border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(16,36,46,.06)}
.tile .tn{font-size:15px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.tile.hasph .tn{padding-right:30px}
.tile .tb{font-size:11px;font-weight:600;opacity:.85;line-height:1.2;margin-top:2px}
.tile .ts{font-size:12px;font-weight:800;line-height:1.15}
.tile.ok{background:#B9E6C8}
.tile.ok .ts{color:#0F5A32}
.tile.warn{background:#FFB15C;color:#2B1300}
.tile.hs{background:#C2301F;color:#fff}
/* Pastilles avec le nom de l'équipement : problèmes d'abord, équipements OK en blanc */
.tile .eqs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.eq{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:999px;border:1.5px solid transparent;padding:2px 7px;font-size:10.5px;font-weight:700;line-height:1.25}
.eq.t-OK{background:#FFFFFF;color:var(--ink);border-color:#D3DFE5}
.eq.t-Mineur{background:#E2670F;color:#1A0A00;border-color:#FFFFFF}
.eq.t-HS{background:#7A150B;color:#FFFFFF;border-color:#FFFFFF}
.tile.att{outline:2px dashed var(--ink);outline-offset:2px}
.tile .ph{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:8px;object-fit:cover}

/* Fiche d'une salle (s'ouvre au clic sur une tuile) */
#fiche{position:fixed;inset:0;background:rgba(16,36,46,.55);z-index:4;display:none;align-items:flex-end;justify-content:center}
#fiche .sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:14px 14px 120px}
#fiche .fermer{display:flex;align-items:center;margin:0 0 10px auto;min-height:44px;padding:0 18px;border-radius:22px;border:0;background:#fff;color:var(--ink);font-size:14px;font-weight:800}

/* Bandeau d'une salle */
.room{background:var(--card);border-radius:20px;box-shadow:0 2px 8px rgba(16,36,46,.06);margin-bottom:10px;overflow:hidden}
.head{width:100%;border:0;background:transparent;text-align:left;padding:14px 16px;display:block;color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.name{font-size:17px;font-weight:800}
.sub{font-size:13px;font-weight:500;color:var(--muted)}
.badge{flex:none;max-width:124px;text-align:center;line-height:1.2;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.badge.ok{background:#E1F3E8;color:#14673A}
.badge.warn{background:#FDE8D2;color:#8F3A05}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* Pastilles d'équipements : OK = fond blanc (jamais teinté), problème = couleur de l'état */
.tag{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;border:2px solid transparent}
.tag.t-OK{background:#FFFFFF;color:var(--ink);border-color:#D3DFE5}
.tag.t-Mineur{background:#E2670F;color:#1A0A00;border-color:#FFFFFF}
.tag.t-HS{background:#7A150B;color:#FFFFFF;border-color:#FFFFFF}
.tag.att{border-style:dashed}
.tag.att::after{content:'en attente';font-size:10px;font-weight:800;text-transform:uppercase;opacity:.85}
.dot{width:8px;height:8px;border-radius:4px;flex:none}
.last{font-size:12px;font-weight:600;margin-top:8px}
.allok{margin-top:10px}
/* Hors service : tout le bandeau en rouge ; problème mineur : tout le bandeau en orange */
.room.hs .head{background:#C2301F;color:#fff}
.room.hs .head .sub{color:#FFE3DE}
.room.hs .badge{background:#fff;color:#8F1D10}
.room.ok .head{background:#B9E6C8;color:var(--ink)}
.room.ok .badge{background:#14673A;color:#fff}
.room.ok .head .sub{color:#2F4A57}
.room.warn .head{background:#FFB15C;color:#2B1300}
.room.warn .head .sub{color:#5A3200}
.room.warn .badge{background:#2B1300;color:#FFE0B8}

.detail{padding:4px 16px 16px;border-top:1px solid #E4ECF0}
.item{padding:12px;margin-top:8px;border-radius:14px;border:2px solid #E4ECF0;background:#FFFFFF}
.item.hs{background:#FBE0DC;border-color:#C2301F}
.item.warn{background:#FDE8D2;border-color:#E2670F}
.item b{font-size:15px;font-weight:700;display:block;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;padding:4px 6px;line-height:1.15;border-radius:12px;border:2px solid #D3DFE5;background:#fff;color:var(--ink);font-size:13px;font-weight:700}
.seg button[aria-pressed="true"].s-OK{background:#14673A;border-color:#14673A;color:#fff}
.seg button[aria-pressed="true"].s-Mineur{background:#9A4A05;border-color:#9A4A05;color:#fff}
.seg button[aria-pressed="true"].s-HS{background:#A32616;border-color:#A32616;color:#fff}
.note{width:100%;margin-top:8px;min-height:44px;border-radius:12px;border:2px solid #D3DFE5;padding:0 12px;font:500 14px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.note.req{border-color:#C2301F}
.empty{text-align:center;color:var(--muted);font-weight:600;padding:24px 0}

/* Photos */
.av{width:48px;height:48px;border-radius:14px;object-fit:cover;background:var(--bg);flex:none;display:flex;align-items:center;justify-content:center}
.photos{padding:12px 0;border-bottom:1px solid #EEF3F6}
.lab{font-size:15px;font-weight:700;margin-bottom:8px;display:block}
.pr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.th{width:64px;height:64px;border-radius:14px;border:0;padding:0;overflow:hidden;background:var(--bg)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.cambtn{min-height:64px;padding:0 16px;border-radius:14px;border:2px dashed #9DB3BF;background:#fff;color:var(--ink);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.pic{width:100%;max-height:55vh;object-fit:contain;border-radius:16px;background:#10242E;display:block}
.pic-load{min-height:160px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted)}

/* Historique de la salle */
.hb{padding:12px 0 0}
.h{background:var(--bg);border-radius:18px;padding:14px 16px;margin-bottom:8px}
.hl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.ini{background:var(--ink);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;letter-spacing:.04em}
.hn{font-size:15px;font-weight:700;margin:6px 0}
.chg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p2{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.p2.OK{background:#E1F3E8;color:#14673A}
.p2.Mineur{background:#FDE8D2;color:#8F3A05}
.p2.HS{background:#FBE0DC;color:#A32616}
.rev{margin-top:10px;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:14px;font-weight:700}

/* Barre de validation */
#barre{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -6px 24px rgba(16,36,46,.14);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;z-index:5}
#barre .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
#barre .tx{flex:1;font-size:14px;font-weight:700;line-height:1.25}
.btn{min-height:48px;padding:0 20px;border-radius:24px;border:0;font-size:15px;font-weight:800}
.btn.pri{background:#E2670F;color:#1A0A00}
.btn.sec{background:#fff;color:var(--ink);border:2px solid #D3DFE5}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Fenêtre de validation */
#modal{position:fixed;inset:0;background:rgba(16,36,46,.55);z-index:10;display:none;align-items:flex-end;justify-content:center}
#modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.recap{display:flex;flex-direction:column;gap:10px}
.rl{background:var(--bg);border-radius:14px;padding:12px 14px}
.rl b{display:block;font-size:15px;margin-bottom:6px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.ini-in{min-height:52px;border-radius:14px;border:2px solid #9DB3BF;padding:0 14px;font:800 22px 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);width:140px}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;font-size:14px;font-weight:600}
.chk input{width:24px;height:24px;flex:none}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.msg{font-size:15px;font-weight:600;line-height:1.4}
.err{color:#A32616;font-weight:700;font-size:14px}

#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
.spin{animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div><small id="sousTitre">Chargement…</small><h1>État des salles du lycée</h1></div>
  <button class="round" id="refresh" aria-label="Actualiser">
    <svg id="refreshIcon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10242E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg>
  </button>
</header>

<section class="hero" aria-live="polite">
  <div><span class="s">Aujourd’hui</span><span class="big" id="heroBig">–</span><span class="s" id="heroSub">&nbsp;</span></div>
  <div><span class="pill" id="pillA">–</span><span class="pill" id="pillB">–</span></div>
</section>

<label class="search">
  <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A6572" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  <input id="q" type="search" placeholder="Rechercher une salle" aria-label="Rechercher une salle" autocomplete="off">
</label>

<div class="chips" role="group" aria-label="Filtre">
  <button class="chip" data-f="all" aria-pressed="true">Toutes</button>
  <button class="chip" data-f="hs" aria-pressed="false">Hors service</button>
  <button class="chip" data-f="warn" aria-pressed="false">Mineur</button>
  <button class="chip" data-f="ok" aria-pressed="false">Tout OK</button>
</div>

<main id="liste"></main>
<div id="fiche" role="dialog" aria-modal="true" aria-label="Fiche de la salle"></div>

<div id="barre">
  <div class="in">
    <div class="tx" id="barreTx">0 modification en attente</div>
    <button class="btn sec" id="annuler">Annuler</button>
    <button class="btn pri" id="valider">Valider</button>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitre"></div>
<div id="toast" role="status"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script>
  /* ---- Connexion à Apps Script (remplace google.script.run) ---- */
var API_URL = 'https://script.google.com/macros/s/AKfycbyDxldbh5V2rssET8EpJtAyGlgnjYLDKUTl884MN8i16dX30GYOKV9UCjCyrGQgCtSB/exec';
var CODE_ACCES = '';
try { CODE_ACCES = localStorage.getItem('codeAcces') || ''; } catch (e) {}

function appel(fn, args, deja) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args, code: CODE_ACCES })
  })
  .then(function (r) { return r.json(); })
  .then(function (j) {
    if (j.error === 'CODE' && !deja) {
      var c = prompt('Code d’accès :');
      if (!c) throw new Error('Code requis');
      CODE_ACCES = c.trim();
      try { localStorage.setItem('codeAcces', CODE_ACCES); } catch (e) {}
      return appel(fn, args, true);
    }
    if (j.error) throw new Error(j.error === 'CODE' ? 'Code incorrect' : j.error);
    return j.result;
  });
}

function runner(ok, ko) {
  return new Proxy({}, { get: function (_, nom) {
    if (nom === 'withSuccessHandler') return function (f) { return runner(f, ko); };
    if (nom === 'withFailureHandler') return function (f) { return runner(ok, f); };
    return function () {
      appel(nom, Array.prototype.slice.call(arguments))
        .then(function (r) { if (ok) ok(r); })
        .catch(function (e) { if (ko) ko(e); });
    };
  } });
}
var google = { script: { run: runner(null, null) } };
/* ---- fin ---- */
var DATA = [];            // une ligne par (salle, équipement) : état enregistré
var HIST = [];            // 3 dernières modifications de chaque salle
var PHOTOS = [];          // photos enregistrées (miniatures)
var FULL = {};            // photos en grand déjà chargées
var salleCible = '';
var pending = {};         // modifications en attente, par clé « salle|équipement »
var filtre = 'all';
var ficheNom = '';        // salle dont la fiche est ouverte
var INIT = '';
try { INIT = localStorage.getItem('initiales') || ''; } catch (e) {}

var EQ_AUTRES = 'Autres (à préciser)';
var ETATS = ['OK', 'Problème mineur', 'Hors service'];
var COULEUR = {'OK':'#1F8A4C', 'Problème mineur':'#E2670F', 'Hors service':'#C2301F'};
var CLASSE  = {'OK':'s-OK', 'Problème mineur':'s-Mineur', 'Hors service':'s-HS'};
var PCLASSE = {'OK':'OK', 'Problème mineur':'Mineur', 'Hors service':'HS'};
var COURT   = {'OK':'OK', 'Problème mineur':'PB mineur', 'Hors service':'HS'};
/* Couleur du point de chaque pastille */
var DOT = {'OK':'#1F8A4C', 'Problème mineur':'#1A0A00', 'Hors service':'#FFFFFF'};

function norm(v) {
  if (v === 'Autre' || v === 'Mineur') return 'Problème mineur';
  if (v === 'HS') return 'Hors service';
  return ETATS.indexOf(v) >= 0 ? v : 'OK';
}

function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  for (var k in (attrs || {})) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'on') { for (var ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); }
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}
function $(id) { return document.getElementById(id); }
function trouver(key) { for (var i = 0; i < DATA.length; i++) if (DATA[i].key === key) return DATA[i]; return null; }
function eff(r) { return pending[r.key] || {statut: r.statut, remarque: r.remarque}; }
function nbPending() { return Object.keys(pending).length; }
function pastille(st) { st = norm(st); return h('span', {'class':'p2 ' + PCLASSE[st], text:st}); }

function toast(msg) {
  var t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 2400);
}

/* ---------- Liste des salles ---------- */
function salles() {
  var map = {}, ordre = [];
  DATA.forEach(function (r) {
    if (!map[r.salle]) { map[r.salle] = {nom: r.salle, bat: r.batiment, items: []}; ordre.push(r.salle); }
    map[r.salle].items.push(r);
  });
  return ordre.map(function (n) {
    var s = map[n];
    s.nbHS = s.items.filter(function (i) { return eff(i).statut === 'Hors service'; }).length;
    s.nbMin = s.items.filter(function (i) { return eff(i).statut === 'Problème mineur'; }).length;
    s.etat = s.nbHS ? 'hs' : (s.nbMin ? 'warn' : 'ok');   // un équipement hors service => rouge ; un problème mineur => orange
    return s;
  });
}

function texteBadge(s) {
  if (s.etat === 'ok') return 'Tout est OK';
  var p = [];
  if (s.nbMin) p.push(s.nbMin + ' PB mineur');
  if (s.nbHS) p.push(s.nbHS + ' hors service');
  return p.join(', ');
}

function texteTuile(s) {
  if (s.etat === 'hs') return s.nbHS + ' HS' + (s.nbMin ? ' + ' + s.nbMin + ' mineur' + (s.nbMin > 1 ? 's' : '') : '');
  if (s.etat === 'warn') return s.nbMin + ' mineur' + (s.nbMin > 1 ? 's' : '');
  return 'Tout OK';
}

/* Une tuile = une salle. Les équipements OK restent blancs, ceux en problème prennent la couleur. */
function tuile(s) {
  var ph = photosDe(s.nom)[0];
  var att = s.items.some(function (i) { return pending[i.key]; });
  var pts = [];
  if (s.etat !== 'ok') {
    var ordre = {'Hors service':0, 'Problème mineur':1, 'OK':2};
    s.items.filter(function (i) { return eff(i).statut !== 'OK'; }).sort(function (a, b) { return ordre[eff(a).statut] - ordre[eff(b).statut]; }).forEach(function (i) {
      var e = eff(i);
      var nom = i.materiel === EQ_AUTRES ? (e.remarque ? 'Autres : ' + e.remarque : 'Autres') : i.materiel;
      pts.push(h('span', {'class':'eq t-' + PCLASSE[e.statut], title:nom, text:nom}));
    });
  }
  return h('button', {'class':'tile ' + s.etat + (att ? ' att' : '') + (ph ? ' hasph' : ''), 'aria-label':s.nom + ', ' + texteBadge(s), on:{click:function () { ouvrirFiche(s.nom); }}}, [
    h('div', {}, [h('div', {'class':'tn', text:s.nom}), s.bat ? h('div', {'class':'tb', text:s.bat}) : null]),
    ph ? h('img', {'class':'ph', src:ph.mini, alt:''}) : null,
    h('div', {}, [h('div', {'class':'ts', text:texteTuile(s)}), pts.length ? h('div', {'class':'eqs'}, pts) : null])
  ]);
}

function majFiche(all) {
  var f = $('fiche');
  if (!ficheNom) { f.style.display = 'none'; f.textContent = ''; return; }
  var s = null;
  all.forEach(function (x) { if (x.nom === ficheNom) s = x; });
  if (!s) { ficheNom = ''; document.body.style.overflow = ''; f.style.display = 'none'; f.textContent = ''; return; }
  var nouvelle = !f.firstChild;
  var ancien = f.firstChild ? f.firstChild.scrollTop : 0;
  f.textContent = '';
  var btn = h('button', {'class':'fermer', text:'Fermer', on:{click:fermerFiche}});
  var feuille = h('div', {'class':'sheet'}, [btn, carte(s)]);
  f.appendChild(feuille);
  f.onclick = function (e) { if (e.target === f) fermerFiche(); };
  f.style.display = 'flex';
  feuille.scrollTop = ancien;
  if (nouvelle) btn.focus();
}
function ouvrirFiche(nom) { ficheNom = nom; document.body.style.overflow = 'hidden'; render(); }
function fermerFiche() { ficheNom = ''; document.body.style.overflow = ''; render(); }

function render() {
  var all = salles();
  var nb = all.length;
  var pretes = all.filter(function (s) { return s.etat === 'ok'; }).length;
  var nbHS = DATA.filter(function (r) { return eff(r).statut === 'Hors service'; }).length;
  var nbMin = DATA.filter(function (r) { return eff(r).statut === 'Problème mineur'; }).length;
  $('sousTitre').textContent = nb + (nb > 1 ? ' salles suivies' : ' salle suivie');
  $('heroBig').textContent = pretes + ' salle' + (pretes > 1 ? 's' : '') + ' sur ' + nb;
  $('heroSub').textContent = (pretes > 1 ? 'sont sans anomalie' : '') + '';
  $('pillA').textContent = nbHS + (nbHS > 1 ? ' équipements hors service' : ' équipement hors service');
  $('pillB').textContent = nbMin + (nbMin > 1 ? ' équipements avec problème mineur' : ' équipement avec problème mineur');

  var q = $('q').value.trim().toLowerCase();
  var vue = all.filter(function (s) {
    if (filtre !== 'all' && s.etat !== filtre) return false;
    return !q || (s.nom + ' ' + s.bat).toLowerCase().indexOf(q) >= 0;
  });

  var zone = $('liste');
  zone.textContent = '';
  if (!vue.length) zone.appendChild(h('div', {'class':'empty', text:'Aucune salle à afficher'}));
  vue.forEach(function (s) { zone.appendChild(tuile(s)); });
  majFiche(all);
  majBarre();
}

function carte(s) {
  var dernier = histoDe(s.nom)[0];
  var tags = [];
  // Salle avec un problème : tous les équipements s'affichent, ceux qui sont OK restent blancs
  var afficherTout = s.etat !== 'ok' || s.items.some(function (i) { return pending[i.key]; });
  if (afficherTout) s.items.forEach(function (i) {
    var e = eff(i);
    var txt = i.materiel === EQ_AUTRES && e.remarque ? 'Autres : ' + e.remarque : i.materiel;
    tags.push(h('span', {'class':'tag t-' + PCLASSE[e.statut] + (pending[i.key] ? ' att' : '')}, [
      h('span', {'class':'dot', style:'background:' + DOT[e.statut]}),
      document.createTextNode(e.statut === 'OK' ? txt : txt + ' · ' + COURT[e.statut])
    ]));
  });
  var head = h('div', {'class':'head'}, [
    h('div', {'class':'top'}, [
      h('div', {'class':'who'}, [avatar(s.nom), h('div', {}, [h('div', {'class':'name', text:s.nom}), h('div', {'class':'sub', text:s.bat})])]),
      h('span', {'class':'badge ' + (s.etat === 'ok' ? 'ok' : 'warn'), text:texteBadge(s)})
    ]),
    tags.length ? h('div', {'class':'tags'}, tags) : h('div', {'class':'sub allok', text:'Les ' + s.items.length + ' équipements sont OK'}),
    dernier ? h('div', {'class':'last', text:'Dernière modification : ' + dernier.date + ' · ' + dernier.initiales}) : null
  ]);
  var el = h('section', {'class':'room ' + s.etat}, [head]);
  el.appendChild(detail(s));
  return el;
}

function detail(s) {
  var d = h('div', {'class':'detail'});
  d.appendChild(sectionPhotos(s.nom));
  s.items.forEach(function (r) {
    var e = eff(r);
    var seg = h('div', {'class':'seg', role:'group', 'aria-label':'État : ' + r.materiel});
    ETATS.forEach(function (st) {
      seg.appendChild(h('button', {'class':CLASSE[st], 'aria-pressed': String(e.statut === st), text:st, on:{click:function () { choisir(r, st); }}}));
    });
    var kids = [h('b', {text:r.materiel}), seg];
    if (e.statut !== 'OK') {
      var autres = r.materiel === EQ_AUTRES;
      kids.push(h('input', {'class':'note' + (autres && !e.remarque.trim() ? ' req' : ''), type:'text', maxlength:'200', value:e.remarque,
        placeholder: autres ? 'Précisez l’équipement concerné (obligatoire)' : 'Précision (facultatif)',
        'aria-label':(autres ? 'Précision obligatoire pour ' : 'Précision pour ') + r.materiel,
        on:{input:function (ev) { setRemarque(r, ev.target.value); ev.target.classList.toggle('req', autres && !ev.target.value.trim()); }}}));
    }
    d.appendChild(h('div', {'class':'item' + (e.statut === 'Hors service' ? ' hs' : (e.statut === 'Problème mineur' ? ' warn' : ''))}, kids));
  });
  d.appendChild(blocHisto(s));
  return d;
}

/* ---------- Modifications en attente ---------- */
function choisir(r, st) {
  var e = eff(r);
  var rem = st === 'OK' ? '' : e.remarque;
  if (st === r.statut && rem === r.remarque) delete pending[r.key];
  else pending[r.key] = {statut: st, remarque: rem};
  render();
}
function setRemarque(r, val) {
  var e = eff(r);
  if (e.statut === r.statut && val === r.remarque) delete pending[r.key];
  else pending[r.key] = {statut: e.statut, remarque: val};
  majBarre();
}
function majBarre() {
  var n = nbPending();
  $('barre').style.display = n ? 'block' : 'none';
  $('barreTx').textContent = n + ' modification' + (n > 1 ? 's' : '') + ' en attente, pas encore enregistrée' + (n > 1 ? 's' : '');
}

/* ---------- Historique propre à chaque salle (3 dernières modifications) ---------- */
function histoDe(nom) { return HIST.filter(function (x) { return x.salle === nom; }).slice(0, 3); }

function blocHisto(s) {
  var liste = histoDe(s.nom);
  var kids = [h('span', {'class':'lab', text:'Dernières modifications de cette salle'})];
  if (!liste.length) kids.push(h('div', {'class':'sub', text:'Aucune modification enregistrée pour l’instant.'}));
  liste.forEach(function (x) {
    var r = null;
    s.items.forEach(function (d) { if (d.materiel === x.materiel) r = d; });
    var av = norm(x.avant), ap = norm(x.apres);
    var bloc = [
      h('div', {'class':'hl'}, [h('span', {text:x.date}), h('span', {'class':'ini', text:x.initiales})]),
      h('div', {'class':'hn', text:x.materiel}),
      h('div', {'class':'chg'}, [pastille(av), h('span', {'aria-label':'devient', text:'→'}), pastille(ap)])
    ];
    if (x.remarque) bloc.push(h('div', {'class':'sub', style:'margin-top:6px', text:'« ' + x.remarque + ' »'}));
    if (r && av !== ap && eff(r).statut === ap) {
      bloc.push(h('button', {'class':'rev', on:{click:function () {
        if (av === r.statut) delete pending[r.key]; else pending[r.key] = {statut: av, remarque: ''};
        render(); toast('Retour en arrière ajouté, à valider');
      }}, text:'Rétablir « ' + av + ' »'}));
    }
    kids.push(h('div', {'class':'h'}, bloc));
  });
  return h('div', {'class':'hb'}, kids);
}

/* ---------- Photos (3 maximum par salle) ---------- */
function photosDe(nom) { return PHOTOS.filter(function (p) { return p.salle === nom; }); }

function iconeCamera(taille, couleur) {
  var NS = 'http://www.w3.org/2000/svg';
  var s = document.createElementNS(NS, 'svg');
  s.setAttribute('width', taille); s.setAttribute('height', taille); s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', couleur); s.setAttribute('stroke-width', '2');
  s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('aria-hidden', 'true');
  var p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M4 8h3l2-3h6l2 3h3v11H4z'); s.appendChild(p);
  var c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', '12'); c.setAttribute('cy', '13'); c.setAttribute('r', '3.5'); s.appendChild(c);
  return s;
}

function avatar(nom) {
  var ph = photosDe(nom);
  if (ph.length) return h('img', {'class':'av', src:ph[0].mini, alt:''});
  return h('div', {'class':'av'}, [iconeCamera(22, '#4A6572')]);
}

function sectionPhotos(nom) {
  var ph = photosDe(nom);
  var ligne = h('div', {'class':'pr'});
  ph.forEach(function (p, i) {
    ligne.appendChild(h('button', {'class':'th', 'aria-label':'Voir la photo ' + (i + 1) + ' de ' + nom, on:{click:function () { voirPhoto(p); }}}, [
      h('img', {src:p.mini, alt:''})
    ]));
  });
  if (ph.length < 3) {
    ligne.appendChild(h('button', {'class':'cambtn', on:{click:function () { ouvrirCamera(nom); }}}, [iconeCamera(22, '#10242E'), h('span', {text:'Prendre une photo'})]));
  }
  var kids = [h('span', {'class':'lab', text:'Photos du Pb de la salle (' + ph.length + '/3)'}), ligne];
  if (ph.length >= 3) kids.push(h('div', {'class':'sub', style:'margin-top:8px', text:'3 photos maximum : ouvrez-en une pour la supprimer et en ajouter une autre.'}));
  return h('div', {'class':'photos'}, kids);
}

function ouvrirCamera(nom) {
  salleCible = nom;
  var c = $('cam'); c.value = ''; c.click();
}

function dessiner(im, max, q) {
  var k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  var c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

function reduire(file, cb) {
  var url = URL.createObjectURL(file);
  var im = new Image();
  im.onload = function () {
    try { var grande = dessiner(im, 1280, 0.8), mini = dessiner(im, 160, 0.6); URL.revokeObjectURL(url); cb(null, grande, mini); }
    catch (e) { cb(e); }
  };
  im.onerror = function () { URL.revokeObjectURL(url); cb(new Error('lecture')); };
  im.src = url;
}

function ouvrirModal(box) {
  var m = $('modal'); m.textContent = ''; m.style.display = 'flex'; m.appendChild(box);
}

function apercu(salle, grande, mini) {
  var erreur = h('div', {'class':'err', role:'alert'});
  var btnOk = h('button', {'class':'btn pri', text:'Enregistrer la photo'});
  var btnRep = h('button', {'class':'btn sec', text:'Reprendre', on:{click:function () { fermer(); ouvrirCamera(salle); }}});
  var btnAnn = h('button', {'class':'btn sec', text:'Annuler', on:{click:fermer}});
  btnOk.addEventListener('click', function () {
    btnOk.disabled = true; btnRep.disabled = true; btnAnn.disabled = true; btnOk.textContent = 'Envoi…'; erreur.textContent = '';
    google.script.run
      .withSuccessHandler(function (res) { PHOTOS.push(res); fermer(); render(); toast('Photo enregistrée'); })
      .withFailureHandler(function (err) {
        btnOk.disabled = false; btnRep.disabled = false; btnAnn.disabled = false; btnOk.textContent = 'Enregistrer la photo';
        erreur.textContent = 'Photo non enregistrée' + (err && err.message ? ' : ' + err.message : '') + '.';
      })
      .ajouterPhoto(salle, grande, mini);
  });
  ouvrirModal(h('div', {'class':'box'}, [
    h('h2', {id:'mTitre', text:'Garder cette photo ?'}),
    h('div', {'class':'sub', text:salle}),
    h('img', {'class':'pic', src:grande, alt:'Aperçu de la photo à enregistrer'}),
    erreur,
    h('div', {'class':'row2'}, [btnAnn, btnRep]),
    h('div', {'class':'row2'}, [btnOk])
  ]));
}

function voirPhoto(p) {
  var zone = h('div', {'class':'pic-load', text:'Chargement…'});
  var actions = h('div', {'class':'row2'});
  var erreur = h('div', {'class':'err', role:'alert'});

  function boutons() {
    actions.textContent = '';
    actions.appendChild(h('button', {'class':'btn sec', text:'Supprimer', on:{click:confirmer}}));
    actions.appendChild(h('button', {'class':'btn pri', text:'Fermer', on:{click:fermer}}));
  }
  function confirmer() {
    actions.textContent = '';
    actions.appendChild(h('button', {'class':'btn sec', text:'Non, garder', on:{click:boutons}}));
    var oui = h('button', {'class':'btn pri', text:'Oui, supprimer'});
    oui.addEventListener('click', function () {
      oui.disabled = true; oui.textContent = 'Suppression…'; erreur.textContent = '';
      google.script.run
        .withSuccessHandler(function () {
          PHOTOS = PHOTOS.filter(function (x) { return x.id !== p.id; });
          delete FULL[p.id]; fermer(); render(); toast('Photo supprimée');
        })
        .withFailureHandler(function () { oui.disabled = false; oui.textContent = 'Oui, supprimer'; erreur.textContent = 'Suppression impossible, réessayez.'; })
        .supprimerPhoto(p.id);
    });
    actions.appendChild(oui);
  }

  boutons();
  ouvrirModal(h('div', {'class':'box'}, [
    h('h2', {id:'mTitre', text:p.salle}),
    h('div', {'class':'sub', text:'Photo du ' + p.date}),
    zone, erreur, actions
  ]));

  function montrer(src) { zone.replaceWith(h('img', {'class':'pic', src:src, alt:'Photo de ' + p.salle})); }
  if (FULL[p.id]) { montrer(FULL[p.id]); return; }
  google.script.run
    .withSuccessHandler(function (src) { FULL[p.id] = src; if ($('modal').style.display === 'flex') montrer(src); })
    .withFailureHandler(function () { zone.textContent = 'Photo impossible à charger'; })
    .getPhoto(p.id);
}

/* ---------- Validation (initiales + relecture) ---------- */
function ouvrirValidation() {
  var cles = Object.keys(pending);
  if (!cles.length) return;
  var m = $('modal');
  m.textContent = ''; m.style.display = 'flex';

  var manque = [];
  var recap = h('div', {'class':'recap'});
  cles.forEach(function (k) {
    var r = trouver(k), p = pending[k];
    if (!r) return;
    if (r.materiel === EQ_AUTRES && p.statut !== 'OK' && !p.remarque.trim()) manque.push(r.salle);
    var kids = [
      h('b', {text:r.salle + ' · ' + r.materiel}),
      h('div', {'class':'chg'}, [pastille(r.statut), h('span', {'aria-label':'devient', text:'→'}), pastille(p.statut)])
    ];
    if (p.remarque) kids.push(h('div', {'class':'sub', style:'margin-top:6px', text:'« ' + p.remarque + ' »'}));
    recap.appendChild(h('div', {'class':'rl'}, kids));
  });

  var ini = h('input', {'class':'ini-in', id:'ini', type:'text', maxlength:'4', value:INIT, autocomplete:'off', autocapitalize:'characters', 'aria-label':'Vos initiales'});
  var relu = h('input', {type:'checkbox', id:'relu'});
  var erreur = h('div', {'class':'err', role:'alert'});
  if (manque.length) erreur.textContent = 'Précisez l’équipement dans « ' + EQ_AUTRES + ' » (' + manque.join(', ') + ') avant d’enregistrer.';
  var btnOk = h('button', {'class':'btn pri', text:'Enregistrer'});
  var btnRetour = h('button', {'class':'btn sec', text:'Retour', on:{click:fermer}});
  var n = cles.length;

  function valide() { return !manque.length && /^[A-Za-zÀ-ÿ]{2,4}$/.test(ini.value.trim()) && relu.checked; }
  function maj() { btnOk.disabled = !valide(); }
  ini.addEventListener('input', maj);
  relu.addEventListener('change', maj);
  btnOk.addEventListener('click', function () {
    if (!valide()) return;
    btnOk.disabled = true; btnRetour.disabled = true; btnOk.textContent = 'Envoi…'; erreur.textContent = '';
    var changes = cles.map(function (k) {
      var r = trouver(k), p = pending[k];
      return {salle: r.salle, materiel: r.materiel, avant: r.statut, statut: p.statut, remarque: p.remarque};
    });
    var initiales = ini.value.trim().toUpperCase();
    google.script.run
      .withSuccessHandler(function (res) {
        try { localStorage.setItem('initiales', initiales); } catch (e) {}
        INIT = initiales; pending = {};
        resultat(res, initiales);
        charger();
      })
      .withFailureHandler(function () {
        btnOk.textContent = 'Enregistrer'; btnRetour.disabled = false; maj();
        erreur.textContent = 'L’enregistrement a échoué. Rien n’a été perdu : vous pouvez réessayer.';
      })
      .enregistrer(changes, initiales);
  });

  var box = h('div', {'class':'box'}, [
    h('h2', {id:'mTitre', text:'Vérifiez avant d’enregistrer'}),
    recap,
    h('label', {'class':'f', 'for':'ini'}, [document.createTextNode('Vos initiales'), ini]),
    h('label', {'class':'chk', 'for':'relu'}, [relu, h('span', {text:'J’ai relu ces ' + n + ' modification' + (n > 1 ? 's' : '') + ' et elles sont correctes'})]),
    erreur,
    h('div', {'class':'row2'}, [btnRetour, btnOk])
  ]);
  m.appendChild(box);
  maj();
  ini.focus();
}

function resultat(res, initiales) {
  var box = $('modal').firstChild;
  box.textContent = '';
  var okTxt = res.enregistrees + ' modification' + (res.enregistrees > 1 ? 's' : '') + ' enregistrée' + (res.enregistrees > 1 ? 's' : '') + ' et envoyée' + (res.enregistrees > 1 ? 's' : '') + ' par ' + initiales + '.';
  box.appendChild(h('h2', {text: res.conflits.length ? 'Enregistré en partie' : 'C’est envoyé'}));
  box.appendChild(h('p', {'class':'msg', text:okTxt}));
  if (res.conflits.length) {
    box.appendChild(h('p', {'class':'msg err', text:'Non enregistré (modifié par quelqu’un d’autre entre-temps, ou précision manquante) : ' + res.conflits.join(' ; ') + '. Vérifiez l’état actuel puis refaites la modification.'}));
  }
  box.appendChild(h('button', {'class':'btn pri', text:'Fermer', on:{click:fermer}}));
}

function fermer() { $('modal').style.display = 'none'; $('modal').textContent = ''; }

/* ---------- Chargement ---------- */
function charger() {
  var ic = $('refreshIcon'); ic.classList.add('spin');
  google.script.run
    .withSuccessHandler(function (res) {
      DATA = res.rows; HIST = res.historique; PHOTOS = res.photos || [];
      Object.keys(pending).forEach(function (k) {
        var r = trouver(k);
        if (!r || (pending[k].statut === r.statut && pending[k].remarque === r.remarque)) delete pending[k];
      });
      ic.classList.remove('spin'); render();
    })
    .withFailureHandler(function () { ic.classList.remove('spin'); toast('Chargement impossible'); })
    .getData();
}

$('refresh').addEventListener('click', charger);
$('cam').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  reduire(f, function (err, grande, mini) {
    if (err) { toast('Photo illisible, réessayez'); return; }
    apercu(salleCible, grande, mini);
  });
});
$('q').addEventListener('input', render);
$('valider').addEventListener('click', ouvrirValidation);
$('annuler').addEventListener('click', function () { pending = {}; render(); toast('Modifications annulées'); });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if ($('modal').style.display === 'flex') fermer();
  else if (ficheNom) fermerFiche();
});
document.querySelectorAll('.chip').forEach(function (b) {
  b.addEventListener('click', function () {
    filtre = b.getAttribute('data-f');
    document.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); });
    render();
  });
});
charger();
</script>
</body>
</html>
